version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
  # Basis-Images (Dockerfile: node, deploy/docker-compose.yml: postgres) – Digest-Pins aktuell halten.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: develop
    schedule:
      interval: weekly
