name: Testumgebung Diagnose
# Read-only diagnosis of the public test environment (DNS, TCP, TLS, HTTP). No secrets.
# Polls up to 40 minutes until the name resolves and HTTPS answers.
on:
  push:
    branches: [stunden-test-diag]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - run: |
          H=stunden-test.appzentrale24.de
          for i in $(seq 1 80); do
            auth="$(dig +short A $H @netcup.firstns.cc | tr '\n' ' ')"
            pub="$(dig +short A $H @1.1.1.1 | tr '\n' ' ')"
            code="$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' https://$H/api/health || true)"
            echo "$(date -u +%H:%M:%S) netcup-NS: ${auth:-leer} | 1.1.1.1: ${pub:-leer} | HTTPS: $code"
            [ "$code" = 200 ] && { curl -sv --max-time 10 https://$H/api/health 2>&1 | grep -E 'subject:|issuer:|expire|^< HTTP|ok'; exit 0; }
            sleep 30
          done
          exit 1
