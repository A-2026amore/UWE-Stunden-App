# Erreichbarkeitsüberwachung aller Anwendungen, Oberfläche unter status.appzentrale24.de
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks: [proxy]

networks:
  proxy:
    external: true
